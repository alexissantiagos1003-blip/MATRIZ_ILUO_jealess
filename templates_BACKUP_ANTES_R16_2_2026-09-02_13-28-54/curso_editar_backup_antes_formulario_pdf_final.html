<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar curso - MATRIZ ILUO</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .contenedor {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .tarjeta {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .pdf-actual {
            margin-top: 8px;
        }

        .pdf-actual a {
            display: inline-block;
            background: #dc2626;
            color: white;
            padding: 9px 14px;
            border-radius: 6px;
            text-decoration: none;
        }

        .acciones {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .boton {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 7px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .guardar {
            background: #16a34a;
            color: white;
        }

        .cancelar {
            background: #6b7280;
            color: white;
        }

        @media (max-width: 600px) {

            .contenedor {
                margin: 20px auto;
            }

            .tarjeta {
                padding: 20px;
            }

            .acciones {
                flex-direction: column;
            }

            .boton {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>


<body>

<div class="contenedor">

    <div class="tarjeta">

        <h1>
            ✏️ Editar curso
        </h1>


        <form
            method="POST"
            action="{{ url_for('editar_curso', id=curso.id) }}"
        >

            <div class="campo">

                <label>
                    Nombre del curso
                </label>

                <input
                    type="text"
                    name="nombre"
                    value="{{ curso.nombre }}"
                    required
                >

            </div>


            <div class="campo">

                <label>
                    Habilidad relacionada
                </label>

                <select
                    name="habilidad_id"
                    required
                >

                    <option value="">
                        Selecciona una habilidad
                    </option>

                    {% for habilidad in habilidades %}

                    <option
                        value="{{ habilidad.id }}"
                        {% if habilidad.id == curso.habilidad_id %}
                        selected
                        {% endif %}
                    >

                        {{ habilidad.nombre }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="campo">

                <label>
                    Duración
                </label>

                <input
                    type="text"
                    name="duracion"
                    value="{{ curso.duracion or '' }}"
                    placeholder="Ej. 2 horas"
                >

            </div>


            <div class="campo">

                <label>
                    🔗 Enlace del curso
                </label>

                <input
                    type="text"
                    name="enlace"
                    value="{{ curso.enlace or '' }}"
                    placeholder="Canva, Drive, etc."
                >

            </div>


            <div class="campo">

                <label>
                    📄 PDF actual
                </label>

                {% if curso.archivo_pdf %}

                <div class="pdf-actual">

                    <a
                        href="{{ url_for('curso_pdf', nombre_archivo=curso.archivo_pdf) }}"
                        target="_blank"
                    >
                        📄 Ver PDF actual
                    </a>

                </div>

                {% else %}

                <p>
                    Este curso no tiene PDF cargado.
                </p>

                {% endif %}

            </div>


            <div class="campo">

                <label>
                    Descripción
                </label>

                <textarea
                    name="descripcion"
                    placeholder="Describe brevemente el contenido del curso"
                >{{ curso.descripcion or '' }}</textarea>

            </div>


            <div class="acciones">

                <button
                    type="submit"
                    class="boton guardar"
                >
                    💾 Guardar cambios
                </button>


                <a
                    href="{{ url_for('cursos') }}"
                    class="boton cancelar"
                >
                    ↩️ Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
